description: >-
  Apiman publishes no plans and no pricing, and correctly so: it is Apache-2.0 licensed
  software that you download and run yourself, not a hosted service with tiers. There is
  no sign-up, no free tier, no paid tier and no overage — the only listed money surface is
  third-party commercial support, consulting and training from Black Parrot Labs (founded
  by Apiman maintainer Marc Savy) and other long-term contributors, whose terms are not
  published. plan_count is 0 because the provider genuinely has nothing to publish.
provenance_note: >-
  REPLACES A FABRICATED SCAFFOLD (2026-09-06). The prior version of this file, written by
  the 2026-05-04 bulk sweep, asserted three tiers — apiman-free (1,000 requests/month, 10
  rpm), apiman-pro (100,000 requests/month, 100 rpm, "price: TBD") and apiman-enterprise
  (negotiated, 1,000 rpm) — with quotas and domains of https://localhost:8080/apiman. None
  of it came from Apiman. It was scaffold default values stamped onto an open-source,
  self-hosted project that has never sold a plan. It has been removed rather than kept,
  per the no-fabrication rule; an honest zero is the measurement.
plans: []
pricing_page: null
free_and_open_source:
  license: Apache-2.0
  license_url: https://github.com/apiman/apiman/blob/master/LICENSE
  cost: 0
  distribution: https://www.apiman.io/download.html
commercial_support:
  published_terms: false
  url: https://www.apiman.io/support.html
  providers:
  - name: Black Parrot Labs
    url: https://www.blackparrotlabs.io
    offering: Long-term enterprise-grade Apiman support, consulting, training and professional services.
    note: >-
      Founded by Apiman co-founder and maintainer Marc Savy. Pricing is not published;
      engagement is by contact. This is a service sold by a company, not a plan sold by
      the Apiman project.
  community_support:
    url: https://github.com/orgs/apiman/discussions
    terms: >-
      "Community support is provided by contributors to the upstream, with questions
      answered in GitHub Issues and Apiman Discussions when people have time. This is
      strictly on a voluntary basis, and there are no guarantees provided."
product_plans_are_not_pricing_plans:
  note: >-
    DISAMBIGUATION, because this trips up automated readers. "Plan" is a first-class
    entity in Apiman's own data model — a named set of policies defining a level of
    service that an API provider offers to client apps (PlanBean / PlanVersionBean,
    listPlans, createPlan, lockPlan). Those are plans that Apiman's USERS create for their
    own consumers. They are not commercial tiers Apiman sells, and must never be harvested
    as such. See data-model/apiman-data-model.yml.
