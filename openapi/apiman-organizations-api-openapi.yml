components:
  schemas:
    ApiPlanOrderDto:
      type: object
      properties:
        order:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/ApiPlanOrderEntryDto'
    ResponseStatsPerPlanBean:
      type: object
      properties:
        data:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ResponseStatsDataPoint'
    UpdateApiPlanDto:
      required:
      - planId
      - version
      type: object
      properties:
        planId:
          type: string
        version:
          type: string
        requiresApproval:
          type: boolean
        discoverability:
          type: string
          enum:
          - PORTAL
          - ANONYMOUS
          - FULL_PLATFORM_MEMBERS
          - ORG_MEMBERS
    PolicyBean:
      type: object
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          description: The type of policy
          enum:
          - Client
          - Plan
          - Api
        organizationId:
          type: string
        entityId:
          type: string
        entityVersion:
          type: string
        name:
          type: string
        description:
          type: string
        configuration:
          type: string
        createdBy:
          type: string
        createdOn:
          type: string
          format: date-time
        modifiedBy:
          type: string
        modifiedOn:
          type: string
          format: date-time
        definition:
          $ref: '#/components/schemas/PolicyDefinitionBean'
        orderIndex:
          type: integer
          format: int32
    ClientBean:
      type: object
      properties:
        organization:
          $ref: '#/components/schemas/OrganizationBean'
        id:
          type: string
        name:
          type: string
        image:
          type: string
        description:
          type: string
        createdBy:
          type: string
        createdOn:
          type: string
          format: date-time
    UsageHistogramBean:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UsageDataPoint'
    NewPlanBean:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        initialVersion:
          type: string
    ApiKeyBean:
      type: object
      properties:
        apiKey:
          type: string
    UpdatePolicyBean:
      type: object
      properties:
        configuration:
          type: string
      description: Update a policy
    ApiVersionBeanDto:
      required:
      - api
      - createdBy
      - createdOn
      - definitionType
      - endpointContentType
      - endpointType
      - id
      - modifiedBy
      - modifiedOn
      - publicDiscoverability
      - publishedOn
      - retiredOn
      - status
      - version
      type: object
      properties:
        id:
          type: integer
          format: int64
        api:
          $ref: '#/components/schemas/ApiBeanDto'
        version:
          type: string
        status:
          type: string
          enum:
          - Created
          - Ready
          - Published
          - Retired
        endpoint:
          type: string
        endpointType:
          type: string
          enum:
          - rest
          - soap
        endpointContentType:
          type: string
          enum:
          - json
          - xml
        endpointProperties:
          type: object
          additionalProperties:
            type: string
        gateways:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/ApiGatewayBean'
        publicAPI:
          type: boolean
        publicDiscoverability:
          type: string
          enum:
          - PORTAL
          - ANONYMOUS
          - FULL_PLATFORM_MEMBERS
          - ORG_MEMBERS
        plans:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/ApiPlanBeanDto'
        createdBy:
          type: string
        createdOn:
          type: string
          format: date-time
        modifiedBy:
          type: string
        modifiedOn:
          type: string
          format: date-time
        publishedOn:
          type: string
          format: date-time
        retiredOn:
          type: string
          format: date-time
        definitionType:
          type: string
          enum:
          - None
          - SwaggerJSON
          - SwaggerYAML
          - WSDL
          - WADL
          - RAML
          - External
        parsePayload:
          type: boolean
        disableKeysStrip:
          type: boolean
        definitionUrl:
          type: string
        extendedDescription:
          type: string
    PlanVersionSummaryBean:
      type: object
      properties:
        organizationId:
          type: string
        organizationName:
          type: string
        id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
          - Created
          - Ready
          - Locked
        version:
          type: string
    ApiSummaryBean:
      type: object
      properties:
        organizationId:
          type: string
        organizationName:
          type: string
        image:
          type: string
        id:
          type: string
        name:
          type: string
        description:
          type: string
        createdOn:
          type: string
          format: date-time
        tags:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/KeyValueTagDto'
    StatusItemBean:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
