          type: string
      - name: apiId
        in: path
        description: The API ID.
        required: true
        schema:
          type: string
      - name: version
        in: path
        description: The API version.
        required: true
        schema:
          type: string
      - name: policyId
        in: path
        description: The Policy ID.
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: If the Policy is successfully returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyBean'
        '404':
          description: If the API does not exist.
    put:
      tags:
      - Organizations
      summary: Update API Policy
      operationId: updateApiPolicy
      parameters:
      - name: organizationId
        in: path
        description: The Organization ID.
        required: true
        schema:
          type: string
      - name: apiId
        in: path
        description: The API ID.
        required: true
        schema:
          type: string
      - name: version
        in: path
        description: The API version.
        required: true
        schema:
          type: string
      - name: policyId
        in: path
        description: The Policy ID.
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePolicyBean'
      responses:
        '204':
          description: If the Policy was successfully updated.
        '404':
          description: If the Policy does not exist.
    delete:
      tags:
      - Organizations
      summary: Remove API Policy
      operationId: deleteApiPolicy
      parameters:
      - name: organizationId
        in: path
        description: The Organization ID.
        required: true
        schema:
          type: string
      - name: apiId
        in: path
        description: The API ID.
        required: true
        schema:
          type: string
      - name: version
        in: path
        description: The API version.
        required: true
        schema:
          type: string
      - name: policyId
        in: path
        description: The Policy ID.
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: If the Policy was successfully deleted.
        '404':
          description: If the Policy does not exist.
  /organizations/{organizationId}/clients/{clientId}:
    get:
      tags:
      - Organizations
      summary: Get Client By ID
      description: Use this endpoint to retrieve information about a single Client by ID. This only returns information about the Client, not any particular version of the client.
      operationId: getClient
      parameters:
      - name: organizationId
        in: path
        description: The Organization ID.
        required: true
        schema:
          type: string
      - name: clientId
        in: path
        description: The Client ID.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: If the Client is successfully returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientBean'
        '404':
          description: If the Client does not exist.
    put:
      tags:
      - Organizations
      summary: Update Client
      operationId: updateClient
      parameters:
      - name: organizationId
        in: path
        description: The Organization ID.
        required: true
        schema:
          type: string
      - name: clientId
        in: path
        description: The Client ID.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
