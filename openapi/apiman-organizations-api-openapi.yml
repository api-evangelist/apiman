  /organizations/{organizationId}/apis/{apiId}/versions/{version}/policies/{policyId}:
    get:
      tags:
      - Organizations
      summary: Get API Policy
      operationId: getApiPolicy
      parameters:
      - name: organizationId
        in: path
        description: The Organization ID.
        required: true
