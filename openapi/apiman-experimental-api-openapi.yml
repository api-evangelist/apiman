        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PolicySummaryBean'
  /devportal/protected/search/apis:
    post:
      tags:
      - Experimental
      summary: Search Apiman APIs
      operationId: searchApis_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchCriteriaBean'
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResultsBeanApiSummaryBean'
components:
  schemas:
    PolicyBean:
      type: object
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          description: The type of policy
          enum:
          - Client
          - Plan
          - Api
        organizationId:
          type: string
        entityId:
          type: string
        entityVersion:
          type: string
        name:
          type: string
        description:
          type: string
        configuration:
          type: string
        createdBy:
          type: string
        createdOn:
          type: string
          format: date-time
        modifiedBy:
          type: string
        modifiedOn:
          type: string
          format: date-time
        definition:
          $ref: '#/components/schemas/PolicyDefinitionBean'
        orderIndex:
          type: integer
          format: int32
    ApiVersionBeanDto:
      required:
      - api
      - createdBy
      - createdOn
      - definitionType
      - endpointContentType
      - endpointType
      - id
      - modifiedBy
      - modifiedOn
      - publicDiscoverability
      - publishedOn
      - retiredOn
      - status
      - version
      type: object
      properties:
        id:
          type: integer
          format: int64
        api:
          $ref: '#/components/schemas/ApiBeanDto'
        version:
          type: string
        status:
          type: string
          enum:
          - Created
          - Ready
          - Published
          - Retired
        endpoint:
          type: string
        endpointType:
          type: string
          enum:
          - rest
          - soap
        endpointContentType:
          type: string
          enum:
          - json
          - xml
        endpointProperties:
          type: object
          additionalProperties:
            type: string
        gateways:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/ApiGatewayBean'
        publicAPI:
          type: boolean
        publicDiscoverability:
          type: string
          enum:
          - PORTAL
          - ANONYMOUS
          - FULL_PLATFORM_MEMBERS
          - ORG_MEMBERS
        plans:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/ApiPlanBeanDto'
        createdBy:
          type: string
        createdOn:
          type: string
          format: date-time
        modifiedBy:
          type: string
        modifiedOn:
          type: string
          format: date-time
        publishedOn:
          type: string
          format: date-time
        retiredOn:
          type: string
          format: date-time
        definitionType:
          type: string
          enum:
          - None
          - SwaggerJSON
          - SwaggerYAML
          - WSDL
          - WADL
          - RAML
          - External
        parsePayload:
          type: boolean
        disableKeysStrip:
          type: boolean
        definitionUrl:
          type: string
        extendedDescription:
          type: string
    ApiSummaryBean:
      type: object
      properties:
        organizationId:
          type: string
        organizationName:
          type: string
        image:
          type: string
        id:
          type: string
        name:
          type: string
        description:
          type: string
        createdOn:
          type: string
          format: date-time
        tags:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/KeyValueTagDto'
    ApiVersionPolicySummaryDto:
      type: object
      properties:
        policyDefinitionId:
          type: string
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        icon:
          type: string
        createdBy:
          type: string
        createdOn:
          type: string
          format: date-time
        policyConfiguration:
          type: string
    ApiVersionEndpointSummaryBean:
      type: object
      properties:
        managedEndpoint:
          type: string
    ApiPlanBeanDto:
      required:
      - planId
      - version
      type: object
      properties:
        planId:
          type: string
        version:
          type: string
        requiresApproval:
          type: boolean
        discoverability:
          type: string
          enum:
          - PORTAL
          - ANONYMOUS
          - FULL_PLATFORM_MEMBERS
          - ORG_MEMBERS
    SearchCriteriaFilterBean:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
        operator:
          type: string
          enum:
          - bool_eq
          - eq
          - neq
          - gt
          - gte
          - lt
          - lte
          - like
    SearchCriteriaBean:
      type: object
      properties:
        filters:
          type: array
          items:
            $ref: '#/components/schemas/SearchCriteriaFilterBean'
        orderBy:
          $ref: '#/components/schemas/OrderByBean'
        paging:
          $ref: '#/components/schemas/PagingBean'
        pageSize:
          $ref: '#/components/schemas/SearchCriteriaBean'
        page:
          $ref: '#/components/schemas/SearchCriteriaBean'
    PagingBean:
      type: object
      properties:
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
    PolicySummaryBean:
      type: object
      properties:
        policyDefinitionId:
          type: string
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        icon:
          type: string
        createdBy:
          type: string
        createdOn:
          type: string
          format: date-time
    OrderByBean:
      type: object
      properties:
        ascending:
          type: boolean
        name:
          type: string
    KeyValueTagDto:
      required:
      - key
      type: object
      properties:
        key:
          type: string
        value:
          type: string
      description: Key value tag pair
    PolicyDefinitionBean:
      type: object
      properties:
        id:
          type: string
        policyImpl:
          type: string
        name:
          type: string
        description:
          type: string
        icon:
          type: string
        templates:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/PolicyDefinitionTemplateBean'
        pluginId:
          type: integer
          format: int64
        formType:
          type: string
          enum:
          - Default
          - JsonSchema
        form:
          type: string
        deleted:
          type: boolean
    SearchResultsBeanApiSummaryBean:
      type: object
      properties:
        beans:
          type: array
          items:
            $ref: '#/components/schemas/ApiSummaryBean'
        totalSize:
          type: integer
          format: int32
    ApiVersionSummaryBean:
      type: object
      properties:
        organizationId:
          type: string
        organizationName:
          type: string
        id:
          type: string
        name:
          type: string
        description:
          type: string
        extendedDescription:
          type: string
        status:
          type: string
          enum:
          - Created
          - Ready
          - Published
          - Retired
        version:
          type: string
        publicAPI:
          type: boolean
        publicDiscoverability:
          type: string
          enum:
          - PORTAL
          - ANONYMOUS
          - FULL_PLATFORM_MEMBERS
          - ORG_MEMBERS
        apiTags:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/KeyValueTagDto'
    DeveloperApiPlanSummaryDto:
      type: object
      properties:
        planId:
          type: string
        planName:
          type: string
        planDescription:
          type: string
        version:
          type: string
        requiresApproval:
          type: boolean
        discoverability:
          type: string
          enum:
          - PORTAL
          - ANONYMOUS
          - FULL_PLATFORM_MEMBERS
          - ORG_MEMBERS
        planPolicies:
          type: array
          items:
            $ref: '#/components/schemas/PolicyBean'
    ApiBeanDto:
      type: object
      properties:
        organization:
          $ref: '#/components/schemas/OrganizationBean'
        id:
          type: string
        name:
          type: string
        image:
          type: string
        description:
          type: string
        tags:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/KeyValueTag'
        createdBy:
          type: string
        createdOn:
          type: string
          format: date-time
        numPublished:
          type: integer
          format: int32
    ApiGatewayBean:
      type: object
      properties:
        gatewayId:
          type: string
    OrganizationBean:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        createdBy:
          type: string
        createdOn:
          type: string
          format: date-time
        modifiedBy:
          type: string
        modifiedOn:
          type: string
          format: date-time
    PolicyDefinitionTemplateBean:
      type: object
      properties:
        language:
          type: string
        template:
          type: string
    KeyValueTag:
      type: object
      properties:
        id:
          type: integer
          format: int64
        key:
          type: string
        value:
          type: string
    NewOrganizationBean:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
