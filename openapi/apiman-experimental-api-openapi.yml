openapi: 3.0.1
info:
  title: API Manager REST Actions Experimental API
  description: The API Manager REST API is used by the API Manager UI to get stuff done. You can use it to automate any API Management task you wish. For example, create new Organizations, Plans, Clients, and APIs.
  version: 3.1.0-SNAPSHOT
servers:
- url: /apiman
tags:
- name: Experimental
paths:
  /devportal/organizations:
    post:
      tags:
      - Experimental
      summary: Create home org for developer
      description: Create a 'home' organization on behalf of the portal user (they may not normally have permissions to do this themselves).
      operationId: createHomeOrgForDeveloper
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrganizationBean'
      responses:
        default:
          description: default response
          content:
            application/json: {}
  /devportal/organizations/{orgId}/apis/{apiId}/versions/{apiVersion}/definition:
    get:
      tags:
      - Experimental
      summary: Get an API Definition (schema) for an API Version
      operationId: getApiDefinition
      parameters:
      - name: orgId
        in: path
        description: The Organization ID
        required: true
        schema:
          type: string
      - name: apiId
        in: path
        description: The API ID
        required: true
        schema:
          type: string
      - name: apiVersion
        in: path
        description: The API Version
        required: true
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json: {}
            application/wsdl+xml: {}
            application/x-yaml: {}
  /devportal/organizations/{orgId}/apis/{apiId}/versions/{apiVersion}:
    get:
      tags:
      - Experimental
      summary: Get a specific API Version
      operationId: getApiVersion
      parameters:
      - name: orgId
        in: path
        description: The Organization ID
        required: true
        schema:
          type: string
      - name: apiId
        in: path
        description: The API ID
        required: true
        schema:
          type: string
      - name: apiVersion
        in: path
        description: The API Version
        required: true
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiVersionBeanDto'
  /devportal/organizations/{orgId}/apis/{apiId}/versions/{apiVersion}/endpoint:
    get:
      tags:
      - Experimental
      summary: Get endpoint information for an API Version
      operationId: getApiVersionEndpointInfo
      parameters:
      - name: orgId
        in: path
        description: The Organization ID
        required: true
        schema:
          type: string
      - name: apiId
        in: path
        description: The API ID
        required: true
        schema:
          type: string
      - name: apiVersion
        in: path
        description: The API Version
        required: true
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiVersionEndpointSummaryBean'
  /devportal/organizations/{orgId}/apis/{apiId}/versions/{apiVersion}/plans:
    get:
      tags:
      - Experimental
      summary: Get all Plans for an API Version
      operationId: getApiVersionPlans
      parameters:
      - name: orgId
        in: path
        description: The Organization ID
        required: true
        schema:
          type: string
      - name: apiId
        in: path
        description: The API ID
        required: true
        schema:
          type: string
      - name: apiVersion
        in: path
        description: The API Version
        required: true
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeveloperApiPlanSummaryDto'
  /devportal/apis/featured:
    get:
      tags:
      - Experimental
      summary: Get all featured APIs
      operationId: getFeaturedApis
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResultsBeanApiSummaryBean'
  /devportal/organizations/{orgId}/plans/{planId}/versions/{planVersion}/policies/{policyId}:
    get:
      tags:
      - Experimental
      summary: Get a specific policy on a plan version
      operationId: getPlanPolicy
      parameters:
      - name: orgId
        in: path
        description: The Organization ID
        required: true
        schema:
          type: string
      - name: planId
        in: path
        description: The Plan ID
        required: true
        schema:
          type: string
      - name: planVersion
        in: path
        description: The Plan Version
        required: true
        schema:
          type: string
      - name: policyId
        in: path
        description: The Policy ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyBean'
  /devportal/organizations/{orgId}/apis/{apiId}/versions/{apiVersion}/policies:
    get:
      tags:
      - Experimental
      summary: List all policies on an API Version
      operationId: listApiPolicies
      parameters:
      - name: orgId
        in: path
        description: The Organization ID
        required: true
        schema:
          type: string
      - name: apiId
        in: path
        description: The API ID
        required: true
        schema:
          type: string
      - name: apiVersion
        in: path
        description: The API Version
        required: true
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiVersionPolicySummaryDto'
  /devportal/organizations/{orgId}/apis/{apiId}/versions:
    get:
      tags:
      - Experimental
      summary: List all API Versions within an organization
      operationId: listApiVersions
      parameters:
      - name: orgId
        in: path
        description: The Organization ID
        required: true
        schema:
          type: string
      - name: apiId
        in: path
        description: The API ID
        required: true
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiVersionSummaryBean'
  /devportal/organizations/{orgId}/plans/{planId}/versions/{planVersion}/policies:
    get:
      tags:
      - Experimental
      summary: List all policies on a specific Plan Version
      operationId: listPlanPolicies
      parameters:
      - name: orgId
        in: path
        description: The Organization ID
        required: true
        schema:
          type: string
      - name: planId
        in: path
        description: The Plan ID
        required: true
        schema:
          type: string
      - name: planVersion
        in: path
        description: The Plan Version
        required: true
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PolicySummaryBean'
  /devportal/search/apis:
    post:
      tags:
      - Experimental
      summary: Search Apiman APIs
      operationId: searchApis
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchCriteriaBean'
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResultsBeanApiSummaryBean'
  /devportal/protected/organizations:
    post:
      tags:
      - Experimental
      summary: Create home org for developer
      description: Create a 'home' organization on behalf of the portal user (they may not normally have permissions to do this themselves).
      operationId: createHomeOrgForDeveloper_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrganizationBean'
      responses:
        default:
          description: default response
          content:
            application/json: {}
  /devportal/protected/organizations/{orgId}/apis/{apiId}/versions/{apiVersion}/definition:
    get:
      tags:
      - Experimental
      summary: Get an API Definition (schema) for an API Version
      operationId: getApiDefinition_3
      parameters:
      - name: orgId
        in: path
        description: The Organization ID
        required: true
        schema:
          type: string
      - name: apiId
        in: path
        description: The API ID
        required: true
        schema:
          type: string
      - name: apiVersion
        in: path
        description: The API Version
        required: true
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json: {}
            application/wsdl+xml: {}
            application/x-yaml: {}
  /devportal/protected/organizations/{orgId}/apis/{apiId}/versions/{apiVersion}:
    get:
      tags:
      - Experimental
      summary: Get a specific API Version
      operationId: getApiVersion_2
      parameters:
      - name: orgId
        in: path
        description: The Organization ID
        required: true
        schema:
          type: string
      - name: apiId
        in: path
        description: The API ID
        required: true
        schema:
          type: string
      - name: apiVersion
        in: path
        description: The API Version
        required: true
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiVersionBeanDto'
  /devportal/protected/organizations/{orgId}/apis/{apiId}/versions/{apiVersion}/endpoint:
    get:
      tags:
      - Experimental
      summary: Get endpoint information for an API Version
      operationId: getApiVersionEndpointInfo_2
      parameters:
      - name: orgId
        in: path
        description: The Organization ID
        required: true
        schema:
          type: string
      - name: apiId
        in: path
        description: The API ID
        required: true
        schema:
          type: string
      - name: apiVersion
        in: path
        description: The API Version
        required: true
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiVersionEndpointSummaryBean'
  /devportal/protected/organizations/{orgId}/apis/{apiId}/versions/{apiVersion}/plans:
    get:
      tags:
      - Experimental
      summary: Get all Plans for an API Version
      operationId: getApiVersionPlans_2
      parameters:
      - name: orgId
        in: path
        description: The Organization ID
        required: true
        schema:
          type: string
      - name: apiId
        in: path
        description: The API ID
        required: true
        schema:
          type: string
      - name: apiVersion
        in: path
        description: The API Version
        required: true
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeveloperApiPlanSummaryDto'
  /devportal/protected/apis/featured:
    get:
      tags:
      - Experimental
      summary: Get all featured APIs
      operationId: getFeaturedApis_1
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResultsBeanApiSummaryBean'
  /devportal/protected/organizations/{orgId}/plans/{planId}/versions/{planVersion}/policies/{policyId}:
    get:
      tags:
      - Experimental
      summary: Get a specific policy on a plan version
      operationId: getPlanPolicy_2
      parameters:
      - name: orgId
        in: path
        description: The Organization ID
        required: true
        schema:
          type: string
      - name: planId
        in: path
        description: The Plan ID
        required: true
        schema:
          type: string
      - name: planVersion
        in: path
        description: The Plan Version
        required: true
        schema:
          type: string
      - name: policyId
        in: path
        description: The Policy ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyBean'
  /devportal/protected/organizations/{orgId}/apis/{apiId}/versions/{apiVersion}/policies:
    get:
      tags:
