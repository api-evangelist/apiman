      - name: apiId
        in: path
        description: The API ID
        required: true
        schema:
          type: string
      - name: apiVersion
        in: path
        description: The API Version
        required: true
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiVersionPolicySummaryDto'
  /devportal/protected/organizations/{orgId}/apis/{apiId}/versions:
    get:
      tags:
      - Experimental
      summary: List all API Versions within an organization
      operationId: listApiVersions_2
      parameters:
      - name: orgId
        in: path
        description: The Organization ID
        required: true
        schema:
          type: string
      - name: apiId
        in: path
        description: The API ID
        required: true
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiVersionSummaryBean'
  /devportal/protected/organizations/{orgId}/plans/{planId}/versions/{planVersion}/policies:
    get:
      tags:
      - Experimental
      summary: List all policies on a specific Plan Version
      operationId: listPlanPolicies_2
      parameters:
      - name: orgId
        in: path
        description: The Organization ID
        required: true
        schema:
          type: string
      - name: planId
        in: path
        description: The Plan ID
        required: true
        schema:
          type: string
      - name: planVersion
