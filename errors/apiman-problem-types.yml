    Apiman's OpenAPI declares NO error schema. Every 4xx response carries a prose
    description and no `content`, so a machine reading the contract cannot learn the shape
    of an error body — only its status code and a sentence. There is no
    application/problem+json (RFC 9457), no error-code registry, and no documented
