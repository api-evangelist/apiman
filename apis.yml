aid: apiman
name: Apiman
description: >-
  Apiman is an open source API management platform featuring a REST API,
  manager UI, and standalone developer portal with multi-tenancy, events,
  notifications, permissions, and approval workflows. It provides extensible
  API gateway capabilities through a simple Java plugin architecture with
  support for policies, plans, organizations, and client management.
